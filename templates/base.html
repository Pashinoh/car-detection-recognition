<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Traffic Analyst PRO{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head_extra %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="{{ url_for('index') }}" class="brand">
                Traffic Analyst PRO
                <span class="brand-sub">Sistem Pemantauan Lalu Lintas</span>
            </a>
            <div class="nav-links">
                <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="active"{% endif %}>Live Monitoring</a>
                <a href="{{ url_for('upload_page') }}" {% if request.endpoint == 'upload_page' or request.endpoint == 'task_status' %}class="active"{% endif %}>Upload &amp; Proses</a>
                <a href="{{ url_for('download_rekap_csv') }}">Download Rekap (CSV)</a>
            </div>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
