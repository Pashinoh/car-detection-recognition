{% extends "base.html" %}

{% block title %}Upload Video & URL{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: auto;">
    <div class="card-header">
        Unggah Video atau URL YouTube
    </div>
    <div class="card-body">
        {% if error %}
            <div style="color: var(--danger-color); margin-bottom: 15px; border: 1px solid var(--danger-color); padding: 10px; border-radius: 4px;">{{ error }}</div>
        {% endif %}
        
        <form method="POST" enctype="multipart/form-data" action="{{ url_for('upload_page') }}">
            <label for="video_file" style="display: block; margin-bottom: 5px; font-weight: bold;">1. Upload File Video (MP4/MOV)</label>
            <input type="file" name="video_file" id="video_file" accept="video/*" style="display: block; width: 100%; margin-bottom: 20px;">

            <p style="text-align: center; margin: 20px 0; font-weight: bold; color: var(--secondary-color);">— ATAU —</p>

            <label for="youtube_url" style="display: block; margin-bottom: 5px; font-weight: bold;">2. Masukkan URL YouTube Live/Video</label>
            <input type="text" name="youtube_url" id="youtube_url" placeholder="Contoh: https://www.youtube.com/watch?v=..." style="display: block; width: 100%; margin-bottom: 30px;">

            <button type="submit" style="width: 100%;">
                Mulai Analisis
            </button>
        </form>
        
        <p style="font-size: 0.9em; color: #777; margin-top: 20px; text-align: center;">
            *Hasil akan berupa file ZIP berisi gambar. File akan dihapus 5-15 menit setelah diunggah/diunduh.
        </p>
    </div>
</div>
{% endblock %}
